<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unterricht heute</title>
<meta name="description" content="Spettungen und Unterrichtsausfall im Schulhaus In der Höh, Volketswil">
<meta name="theme-color" content="#20374C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unterricht">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Eine schmale Spalte wie ein Tageszettel: Status oben, Lektionen als Zeitleiste darunter */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --fg:#14202B; --muted:#5A6876; --line:#D7DEE5; --ink:#20374C; --ink-fg:#FFFFFF;
  --ok:#1C7F46; --ok-bg:#DDF2E5; --spett:#2159C2; --spett-bg:#E2EBFB; --vertr:#0B7680; --vertr-bg:#DBF0F1; --aus:#C2570B; --aus-bg:#FBE7D6; --now:#20374C;
  --demo:#8A5A00; --demo-bg:#FFF3D6;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E141A; --surface:#17202A; --fg:#E6ECF2; --muted:#98A6B4; --line:#2A3743; --ink:#C9DBEC; --ink-fg:#0E141A;
  --ok:#55C886; --ok-bg:#12301F; --spett:#82AEF5; --spett-bg:#162A48; --vertr:#5CC9D1; --vertr-bg:#0F2F31; --aus:#F39A50; --aus-bg:#3A2312; --now:#C9DBEC;
  --demo:#F2C46B; --demo-bg:#33280F; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--spett);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:76px;height:auto;flex:none;color:var(--fg)}
.brand h1{font-size:1.5rem;font-weight:800}
.brand p{margin:0;font-size:.85rem;color:var(--muted)}
.reload{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:44px;height:44px;display:grid;place-items:center}
.reload svg{width:20px;height:20px}
.reload.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.banner{border-radius:14px;padding:10px 14px;font-size:.9rem;background:var(--demo-bg);color:var(--demo);font-weight:700}

.klasse{display:flex;align-items:center;justify-content:space-between;gap:10px}
.klasse-chip{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.link{border:0;background:none;color:var(--spett);font-weight:700;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column}
.tabs button b{font-size:1rem}
.tabs button span{font-size:.82rem;color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.status{border-radius:20px;padding:20px 20px 18px;display:flex;gap:16px;align-items:flex-start}
.status .dot{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--surface);font-weight:800;font-size:1.3rem}
.status h2{font-size:1.6rem;font-weight:800;line-height:1.15}
.status p{margin:4px 0 0}
.status.ok{background:var(--ok-bg)} .status.ok .dot{background:var(--ok)} .status.ok h2{color:var(--ok)}
.status.spett{background:var(--spett-bg)} .status.spett .dot{background:var(--spett)} .status.spett h2{color:var(--spett)}
.status.vertr{background:var(--vertr-bg)} .status.vertr .dot{background:var(--vertr)} .status.vertr h2{color:var(--vertr)}
.status.aus{background:var(--aus-bg)} .status.aus .dot{background:var(--aus)} .status.aus h2{color:var(--aus)}
.status.frei,.status.wait{background:var(--surface);border:1px solid var(--line)} .status.frei .dot,.status.wait .dot{background:var(--muted)}

.notice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;overflow-wrap:anywhere}
.notice::before{content:"i";flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--ink-fg);font-weight:800;font-size:.8rem;display:grid;place-items:center;margin-top:2px}

.plan{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:7.2em 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem}
.row .l{font-weight:700;min-width:0}
.row .note{display:block;font-weight:400;font-size:.9rem;margin-top:2px;overflow-wrap:anywhere}
.row.pause{padding:5px 14px;background:var(--bg);grid-template-columns:7.2em 1fr}
.row.pause .t,.row.pause .l{font-size:.8rem;font-weight:400;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row.spett{background:var(--spett-bg);box-shadow:inset 4px 0 0 var(--spett)}
.row.aus{background:var(--aus-bg);box-shadow:inset 4px 0 0 var(--aus)}
.row.vertr{background:var(--vertr-bg);box-shadow:inset 4px 0 0 var(--vertr)}
.row.aus .l>span:first-child{text-decoration:line-through;text-decoration-thickness:2px}
.row.jetzt .t{color:var(--now);font-weight:700}
.tag{font-size:.78rem;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag.spett{background:var(--spett);color:var(--surface)}
.tag.aus{background:var(--aus);color:var(--surface)}
.tag.vertr{background:var(--vertr);color:var(--surface)}
.tag.now{border:1.5px solid var(--now);color:var(--now)}

.foot{display:flex;flex-direction:column;gap:10px;font-size:.9rem}
.foot p{margin:0}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
summary{cursor:pointer;font-weight:700;padding:10px 0}
details ol{margin:0 0 12px;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
details h3{font-size:.95rem;margin:6px 0 4px}

.picker h2{font-size:1.5rem}
.picker p{margin:6px 0 14px}
.stufen{display:flex;flex-direction:column;gap:10px}
.grid-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid-k button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 8px;font-family:var(--f-display);font-weight:800;font-size:1.02rem;white-space:nowrap;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:1.25rem}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-size:.9rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.tablewrap{overflow-x:auto}
table.schule{border-collapse:separate;border-spacing:3px;width:100%;font-size:.85rem}
table.schule th{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding:2px}
table.schule th.k{text-align:left;white-space:nowrap;color:var(--fg);padding-right:6px}
table.schule td{height:30px;min-width:26px;border-radius:7px;background:var(--bg);text-align:center;font-weight:800;font-size:.75rem}
table.schule td.spett{background:var(--spett);color:var(--surface)}
table.schule td.aus{background:var(--aus);color:var(--surface)}
table.schule td.vertr{background:var(--vertr);color:var(--surface)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.legend .s{background:var(--spett)} .legend .v{background:var(--vertr)} .legend .a{background:var(--aus)}
@media (prefers-reduced-motion:reduce){.reload.spin svg{animation:none}}
</style>
</head>

var LEKT = PLAN.filter(function(x){return x.n});
var ART = {spett:"Spettplan",vertr:"Vertretung",aus:"Fällt aus"};
var KURZ = {spett:"S",vertr:"V",aus:"A"};
var INFO = {spett:"Nach Spettplan in die zugeteilte Klasse",vertr:"Vertretungslehrperson, Unterricht im gewohnten Zimmer",aus:""};
var TAGE = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
var MONATE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var S = {tab:0, klasse:store("uh-klasse"), pick:false, loading:true, data:null, offline:false, fetched:null, err:false, schuleTab:0};
if(KLASSEN.indexOf(S.klasse)<0) S.klasse=null;

function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function heute(){var d=new Date();d.setHours(0,0,0,0);return d}
function isWE(d){return d.getDay()===0||d.getDay()===6}
function naechster(d){var x=new Date(d);do{x.setDate(x.getDate()+1)}while(isWE(x));return x}
function lang(d){return TAGE[d.getDay()]+", "+d.getDate()+". "+MONATE[d.getMonth()]}
function kurz(d){return d.getDate()+"."+(d.getMonth()+1)+"."}
function tage(){var t=heute(),n=naechster(t),m=new Date(t);m.setDate(t.getDate()+1);
  return [{d:t,label:"Heute"},{d:n,label:iso(n)===iso(m)?"Morgen":TAGE[n.getDay()]}]}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function min(t){var p=t.split(":");return +p[0]*60 + +p[1]}
function stufen(){var g=[],m={};KLASSEN.forEach(function(k){var s=k.slice(0,6);if(!m[s]){m[s]=[];g.push(m[s])}m[s].push(k)});return g}

/* ---------- CSV lesen ---------- */
function parseCSV(t){
  var rows=[],row=[],f="",q=false,i,c;
  for(i=0;i<t.length;i++){c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f=""}
    else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}
    else if(c!=="\r")f+=c;}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
/* Datum: 11.11.2026 · 2026-11-11 · 11/11/2026 (mit oder ohne Uhrzeit) */
function parseDate(s){
  s=String(s||"").trim();if(!s)return null;var m,d;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/)))d=new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));
  else if((m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/)))d=new Date(m[3].length===2?2000+ +m[3]:+m[3],m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));
  else if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/))){var a=+m[1],b=+m[2];
    if(a>12)d=new Date(+m[3],b-1,a,+(m[4]||0),+(m[5]||0));else d=new Date(+m[3],a-1,b,+(m[4]||0),+(m[5]||0))}
  return d&&!isNaN(d)?d:null;
}
function parseLektionen(s){
  s=String(s||"");var set={},low=s.toLowerCase();
  if(low.indexOf("ganzer tag")>=0)return [1,2,3,4,5,6,7,8,9];
  if(low.indexOf("vormittag")>=0)[1,2,3,4,5].forEach(function(n){set[n]=1});
  if(low.indexOf("nachmittag")>=0)[6,7,8,9].forEach(function(n){set[n]=1});
  var re=/(\d)\.\s*Lektion/gi,m;while((m=re.exec(s)))set[+m[1]]=1;
  if(!Object.keys(set).length)s.split(/[,;\s]+/).forEach(function(x){if(/^[1-9]\.?$/.test(x))set[parseInt(x,10)]=1});
  return Object.keys(set).map(Number).filter(function(n){return n>=1&&n<=9}).sort(function(a,b){return a-b});
}
function parseKlassen(s){
  var teile=String(s||"").split(",").map(function(x){return x.trim()});
  if(teile.some(function(x){return /alle klassen/i.test(x)}))return KLASSEN.slice();
  return KLASSEN.filter(function(k){return teile.indexOf(k)>=0});
}
function toData(text){
  var rows=parseCSV(text).filter(function(r){return r.some(function(c){return c.trim()})});
  var out={entries:[],notices:[],updated:null};if(!rows.length)return out;
  var h=rows[0].map(function(x){return x.toLowerCase()});
  function col(words,fb){for(var i=0;i<h.length;i++)for(var j=0;j<words.length;j++)if(h[i].indexOf(words[j])>=0)return i;return fb}
  var cTs=col(["zeitstempel","timestamp"],0),cD=col(["datum","date"],1),cK=col(["klasse"],2),cL=col(["lektion"],3),cA=col(["art"],4),cH=col(["hinweis","text","mitteilung"],5);
  rows.slice(1).forEach(function(r){
    var ts=parseDate(r[cTs]);if(ts&&(!out.updated||ts>out.updated))out.updated=ts;
    var d=parseDate(r[cD]);if(!d)return;var dIso=iso(d);
    var art=String(r[cA]||"").toLowerCase(),note=String(r[cH]||"").trim().slice(0,140);
    if(art.indexOf("mitteilung")>=0){if(note)out.notices.push({date:dIso,text:note});return}
    var type=art.indexOf("spett")>=0?"spett":art.indexOf("vertret")>=0?"vertr":(art.indexOf("fällt")>=0||art.indexOf("faellt")>=0||/\baus\b/.test(art))?"aus":null;if(!type)return;
    var ks=parseKlassen(r[cK]),ls=parseLektionen(r[cL]);if(!ks.length||!ls.length)return;
    out.entries.push({date:dIso,classes:ks,lessons:ls,type:type,note:note.slice(0,100)});
  });
  return out;
}
function beispiel(){
  var T=tage(),a=iso(T[0].d),b=iso(T[1].d);
  return {demo:true,updated:new Date(),notices:[{date:a,text:"Beispiel: Der Sporttag wird auf Freitag verschoben."}],
    entries:[{date:a,classes:["1. Sek A","1. Sek B"],lessons:[3,4],type:"spett",note:""},
             {date:a,classes:["1. Sek C"],lessons:[5],type:"vertr",note:"Zimmer 12"},
             {date:a,classes:["2. Sek Kof"],lessons:[8,9],type:"aus",note:""},
             {date:b,classes:["3. Sek Ste"],lessons:[1],type:"aus",note:"Erst um 08:20 in der Schule"}]};
}

function laden(){
  if(!CSV_URL){S.data=beispiel();S.loading=false;render();return}
  S.loading=true;render();
  fetch(CSV_URL+(CSV_URL.indexOf("?")>=0?"&":"?")+"t="+Date.now(),{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})
    .then(function(t){S.data=toData(t);S.offline=false;S.err=false;S.fetched=new Date();store("uh-csv",t);store("uh-csv-zeit",S.fetched.toISOString())})
    .catch(function(){var t=store("uh-csv");if(t){S.data=toData(t);S.offline=true;var z=store("uh-csv-zeit");S.fetched=z?new Date(z):null}else S.err=true})
    .then(function(){S.loading=false;render()});
}

function lessonMap(k,dIso){var m={};(S.data?S.data.entries:[]).forEach(function(e){
  if(e.date===dIso&&e.classes.indexOf(k)>=0)e.lessons.forEach(function(n){m[n]=e})});return m}

/* ---------- Anzeige ---------- */
function kopf(){
  return '<header class="top"><div class="brand">'+LOGO+'<div><h1>Unterricht heute</h1><p>'+SCHULE+'</p></div></div>'+
    '<button type="button" class="reload'+(S.loading?' spin':'')+'" data-act="reload" aria-label="Aktualisieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></header>'+
    (S.data&&S.data.demo?'<div class="banner">Beispieldaten: Der CSV-Link ist noch nicht eingetragen.</div>':'')+
    (S.offline?'<div class="banner">Keine Verbindung. Du siehst den letzten geladenen Stand.</div>':'');
}
function picker(){
  return '<section class="picker"><h2>Welche Klasse bist du?</h2><p class="muted">Du wählst nur einmal. Auf diesem Handy bleibt deine Klasse gespeichert.</p><div class="stufen">'+
    stufen().map(function(r){return '<div class="grid-k">'+r.map(function(k){return '<button type="button" data-act="set-klasse" data-k="'+esc(k)+'">'+esc(k)+'</button>'}).join("")+'</div>'}).join("")+'</div></section>';
}
function aktualisiert(){
  var u=S.data&&S.data.updated;
  if(!u)return '<p class="muted">Zuletzt aktualisiert: noch keine Einträge</p>';
  var t=heute(),g=new Date(t);g.setDate(t.getDate()-1);
  var tt=iso(u)===iso(t)?"heute":iso(u)===iso(g)?"gestern":kurz(u);
  return '<p class="muted num">Zuletzt aktualisiert: '+tt+', '+pad(u.getHours())+':'+pad(u.getMinutes())+' Uhr</p>';
}
function schueler(){
  if(!S.klasse||S.pick)return picker();
  var T=tage(),tag=T[S.tab],dIso=iso(tag.d),k=S.klasse,m=lessonMap(k,dIso);
  var ns=Object.keys(m).map(Number),cnt=function(t){return ns.filter(function(n){return m[n].type===t}).length},nA=cnt("aus"),nS=cnt("spett"),nV=cnt("vertr");
  var h='<div class="klasse"><span class="klasse-chip">'+esc(k)+'</span><button type="button" class="link" data-act="pick">Klasse ändern</button></div>';
  h+='<div class="tabs" role="tablist">'+T.map(function(t,i){return '<button type="button" role="tab" aria-selected="'+(S.tab===i)+'" data-act="tab" data-i="'+i+'"><b>'+t.label+'</b><span>'+lang(t.d)+'</span></button>'}).join("")+'</div>';
  var cls,sym,title,sub;
  if(!S.data&&S.err){cls="wait";sym="?";title="Keine Verbindung";sub="Die Daten konnten nicht geladen werden. Prüfe dein Internet und tippe oben auf Aktualisieren."}
  else if(!S.data){cls="wait";sym="…";title="Wird geladen";sub="Einen Moment."}
  else if(isWE(tag.d)){cls="frei";sym="–";title="Wochenende";sub="Heute ist kein Unterricht. Schau beim Tab daneben, wie es am "+T[1].label+" aussieht."}
  else if(!ns.length){cls="ok";sym="✓";title="Unterricht nach Plan";sub="Für "+esc(k)+" ist "+(S.tab===0?"heute":"am "+T[1].label)+" nichts geändert."}
  else{cls=nA?"aus":nS?"spett":"vertr";sym="!";title=nA===9?"Kein Unterricht":"Es gibt Änderungen";
    var p=[];if(nA)p.push(nA+(nA===1?" Lektion fällt aus":" Lektionen fallen aus"));if(nS)p.push(nS+(nS===1?" Lektion nach Spettplan":" Lektionen nach Spettplan"));if(nV)p.push(nV+(nV===1?" Lektion mit Vertretung":" Lektionen mit Vertretung"));sub=p.join(" · ")}
  h+='<section class="status '+cls+'" aria-live="polite"><div class="dot" aria-hidden="true">'+sym+'</div><div><h2>'+title+'</h2><p>'+sub+'</p></div></section>';
  if(S.data)S.data.notices.filter(function(n){return n.date===dIso}).forEach(function(n){h+='<div class="notice"><span>'+esc(n.text)+'</span></div>'});
  if(!isWE(tag.d)){
    var now=new Date(),nm=now.getHours()*60+now.getMinutes();
    h+='<section class="plan" aria-label="Tagesablauf">'+PLAN.map(function(x){
      var t='<span class="t">'+x.von+'–'+x.bis+'</span>';
      if(x.p)return '<div class="row pause">'+t+'<span class="l">'+x.p+'</span></div>';
      var e=m[x.n],jetzt=S.tab===0&&nm>=min(x.von)&&nm<min(x.bis);
      return '<div class="row'+(e?" "+e.type:"")+(jetzt?" jetzt":"")+'">'+t+'<span class="l"><span>'+x.n+'. Lektion</span>'+(e&&(e.note||INFO[e.type])?'<span class="note">'+esc([INFO[e.type],e.note].filter(Boolean).join(" · "))+'</span>':'')+'</span>'+
        (e?'<span class="tag '+e.type+'">'+ART[e.type]+'</span>':(jetzt?'<span class="tag now">jetzt</span>':''))+'</div>';
    }).join("")+'</section>';
  }
  h+='<div class="foot">'+aktualisiert()+
    '<details><summary>So kommt die App auf dein Handy</summary><h3>iPhone</h3><ol><li>Diese Seite in Safari öffnen</li><li>Teilen-Symbol antippen (Quadrat mit Pfeil)</li><li>«Zum Home-Bildschirm» wählen</li></ol><h3>Android</h3><ol><li>Diese Seite in Chrome öffnen</li><li>Menü oben rechts (drei Punkte) antippen</li><li>«Zum Startbildschirm hinzufügen» oder «App installieren» wählen</li></ol></details>'+
    '<p class="muted">Hier stehen nur geänderte Lektionen. Alles andere läuft nach deinem normalen Stundenplan.</p>'+
    '<p><a class="link" href="#schule">Übersicht ganze Schule</a></p></div>';
  return h;
}
function schule(){
  var T=tage(),st=T[S.schuleTab],sIso=iso(st.d);
  return '<p><a class="link" href="#">← Zurück zur Klassenansicht</a></p><section class="card"><div class="top"><h2>Ganze Schule</h2><div class="seg">'+
    T.map(function(t,i){return '<button type="button" aria-pressed="'+(S.schuleTab===i)+'" data-act="schule-tab" data-i="'+i+'">'+t.label+'</button>'}).join("")+'</div></div>'+
    '<p class="muted" style="margin:0">'+lang(st.d)+'</p><div class="tablewrap"><table class="schule"><thead><tr><th></th>'+LEKT.map(function(x){return '<th scope="col">'+x.n+'</th>'}).join("")+'</tr></thead><tbody>'+
    KLASSEN.map(function(k){var m=lessonMap(k,sIso);return '<tr><th scope="row" class="k">'+esc(k)+'</th>'+LEKT.map(function(x){var e=m[x.n];
      return e?'<td class="'+e.type+'" title="'+ART[e.type]+'">'+KURZ[e.type]+'</td>':'<td></td>'}).join("")+'</tr>'}).join("")+
    '</tbody></table></div><div class="legend"><span><i class="s"></i>S = Spettplan</span><span><i class="v"></i>V = Vertretung</span><span><i class="a"></i>A = Fällt aus</span></div></section>'+
    '<div class="foot">'+aktualisiert()+'</div>';

function render(){
  document.getElementById("app").innerHTML=kopf()+(location.hash==="#schule"?schule():schueler());
}

document.getElementById("app").addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;
  switch(b.dataset.act){
    case "set-klasse":S.klasse=b.dataset.k;S.pick=false;store("uh-klasse",S.klasse);break;
    case "pick":S.pick=true;break;
    case "tab":S.tab=+b.dataset.i;break;
    case "schule-tab":S.schuleTab=+b.dataset.i;break;
    case "reload":laden();return;
  }
